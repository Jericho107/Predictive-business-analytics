[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-business-analytics"
version = "2.0.0"
description = "Baseline-first predictive analytics with chronological evaluation, leakage controls and model acceptance gates."
requires-python = ">=3.12"
dependencies = ["scikit-learn>=1.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
